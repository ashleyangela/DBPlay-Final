<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About DonBelle | DB PLAY</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >
  <link rel="stylesheet" href="gallery.css">
  <link rel="stylesheet" href="about.css">
  <link rel="icon" type="image/png" href="PHOTOS/logo.png">
</head>

<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <header class="glass-header">
    <div class="nav-left">
      <a href="homepage.html" class="logo-container">
        <img
          src="GENERAL_PHOTOS/LOGO.png"
          alt="DB PLAY Logo"
          class="site-logo"
        >
      </a>

      <ul class="nav-links">
        <li><a href="homepage.html">HOME</a></li>
        <li><a href="movie_or_series.html">Movie/Series</a></li>
        <li><a href="watchlist.html">My Watchlist</a></li>
        <li><a href="news.html">News &amp; Update</a></li>
      </ul>
    </div>

    <div class="nav-right">
      <form class="search-box" id="searchForm" role="search">
        <input
          type="text"
          id="searchInput"
          placeholder="Search..."
          class="glass-input"
          aria-label="Search"
          autocomplete="off"
        >

        <i
          class="fa-solid fa-magnifying-glass search-icon"
          id="searchIcon"
          role="button"
          tabindex="0"
          aria-label="Search"
        ></i>
      </form>

      <img
        src="GENERAL_PHOTOS/PROFILE-AVATAR.png"
        alt="User Profile"
        class="profile-avatar"
      >

      <div class="profile-menu-container">
        <button
          class="menu-btn"
          id="menuBtn"
          aria-label="Open menu"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="menuPanel"
        >
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="profile-dropdown" id="menuPanel">
          <a href="about.html" aria-current="page">
            <i class="fa-solid fa-circle-info"></i>
            <span>About</span>
          </a>

          <a href="gallery.html">
            <i class="fa-regular fa-images"></i>
            <span>Gallery</span>
          </a>

          <a href="contact.html">
            <i class="fa-regular fa-envelope"></i>
            <span>Contact Us</span>
          </a>

          <a href="playlist.html">
            <i class="fa-solid fa-music"></i>
            <span>Playlist</span>
          </a>

          <a href="index.html" id="signOut">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Sign Out</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- JavaScript renders the About DonBelle content here -->
  <main class="about-main">
    <div id="aboutCard" class="about-card"></div>
  </main>

  <footer class="glass-footer">
    <img
      src="PHOTOS/DB LOGO.png"
      alt="DB PLAY Logo"
      class="footer-logo"
    >

    <div class="footer-version">Version: 26.09.03-1</div>

    <div class="footer-links">
      <a href="#">Help and Support</a>
      <a href="#">Terms and Conditions</a>
      <a href="#">Privacy Policy</a>
      <a href="#">Cookie Policy</a>
    </div>

    <div class="social-icons">
      <a href="#" aria-label="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
      <a href="#" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="#" aria-label="TikTok">
        <i class="fa-brands fa-tiktok"></i>
      </a>
      <a href="#" aria-label="X">
        <i class="fa-brands fa-x-twitter"></i>
      </a>
      <a href="#" aria-label="YouTube">
        <i class="fa-brands fa-youtube"></i>
      </a>
    </div>

    <div class="copyright">
      Copyright &copy; 2026 DB Play | All Rights Reserved.
    </div>
  </footer>

  <script src="about.js"></script>
</body>
</html>
